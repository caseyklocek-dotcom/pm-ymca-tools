<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Practicing Musician × YMCA — Branch ROI Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Lora:ital,wght@1,400;1,600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', sans-serif; }

:root {
  --brass:          #B87333;
  --brass-light:    #D4924A;
  --brass-glow:     rgba(184,115,51,0.22);
  --brass-tint:     rgba(184,115,51,0.08);
  --cerulean:       #355E8D;
  --cerulean-light: #4A7BB0;
  --cerulean-tint:  rgba(53,94,141,0.15);
  --raisin:         #211E1C;
  --raisin-card:    #2C2623;
  --raisin-deep:    #181513;
  --border:         #3A3532;
  --border-light:   #4A4542;
  --muted:          #6B7280;
  --muted-light:    #9aa3af;
  --text:           #FFFFFF;
  --text-dim:       rgba(255,255,255,0.6);
  --text-faint:     rgba(255,255,255,0.3);
  --positive:       #5eead4;
  --negative:       #f87171;
  --green:          #4ade80;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--raisin); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 5px; border-radius: 999px;
  background: var(--border); outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px;
  border-radius: 999px; background: var(--brass);
  border: 2px solid var(--raisin-card);
  box-shadow: 0 0 0 3px var(--brass-glow); cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 999px;
  background: var(--brass); border: 2px solid var(--raisin-card); cursor: pointer;
}

@keyframes fadeUp    { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideIn   { from { opacity:0; transform:translateX(28px); } to { opacity:1; transform:translateX(0); } }
@keyframes countUp   { from { opacity:0.5; transform:scale(0.97); } to { opacity:1; transform:scale(1); } }
@keyframes stepDone  { 0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);} }

.fade-up  { animation: fadeUp  0.42s ease-out both; }
.slide-in { animation: slideIn 0.38s ease-out both; }

/* Progress */
.pstep { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; transition:all .3s ease; }
.pstep.done   { background:var(--brass); color:var(--raisin); animation:stepDone .35s ease; }
.pstep.active { background:transparent; color:var(--brass); border:2px solid var(--brass); }
.pstep.idle   { background:var(--border); color:var(--muted); }
.pline { height:2px; flex:1; background:var(--border); transition:background .4s ease; margin:0 6px; margin-bottom:18px; }
.pline.done { background:var(--brass); }

/* Cards */
.card { background:var(--raisin-card); border:1px solid var(--border); border-radius:18px; box-shadow:0 8px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.03); }
.inner { background:var(--raisin); border:1px solid var(--border); border-radius:12px; }

/* Pathway cards */
.pw-card { border:1px solid var(--border); border-radius:16px; padding:22px; background:var(--raisin); cursor:pointer; transition:all .2s ease; user-select:none; }
.pw-card:hover { border-color:var(--border-light); transform:translateY(-2px); }
.pw-card.sel-outright  { border-color:var(--brass); box-shadow:0 0 0 2px var(--brass-glow), 0 8px 24px rgba(184,115,51,0.12); background:var(--brass-tint); }
.pw-card.sel-donor     { border-color:var(--green); box-shadow:0 0 0 2px rgba(74,222,128,0.18), 0 8px 24px rgba(74,222,128,0.08); background:rgba(74,222,128,0.04); }
.pw-card.sel-waitlist  { border-color:var(--cerulean); box-shadow:0 0 0 2px rgba(53,94,141,0.22), 0 8px 24px rgba(53,94,141,0.08); background:var(--cerulean-tint); }

/* Stream cards */
.stream { background:var(--raisin); border:1px solid var(--border); border-radius:14px; padding:20px; }

/* KPI strip */
.kpi-strip { display:flex; gap:1px; background:var(--border); border-radius:14px; overflow:hidden; }
.kpi-cell { flex:1; background:var(--raisin-card); padding:14px 18px; min-width:0; }

/* Buttons */
.btn { background:var(--brass); color:var(--raisin); border:none; border-radius:12px; padding:12px 28px; font-size:15px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; transition:filter .15s, transform .1s; display:inline-flex; align-items:center; gap:7px; }
.btn:hover { filter:brightness(1.1); }
.btn:active { transform:translateY(1px); }
.btn:disabled { opacity:.35; cursor:not-allowed; filter:none; }
.btn-ghost { background:transparent; color:var(--text-dim); border:1px solid var(--border); border-radius:12px; padding:12px 22px; font-size:14px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; transition:all .15s; }
.btn-ghost:hover { background:var(--raisin); border-color:var(--border-light); color:var(--text); }

/* Fields */
.field { background:var(--raisin); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:'Inter',sans-serif; font-size:15px; font-weight:600; padding:10px 14px; outline:none; width:100%; transition:border-color .2s; }
.field:focus { border-color:var(--brass); }
.field::placeholder { color:var(--muted); }

.num-input { background:var(--raisin); border:1px solid var(--border); border-radius:8px; color:var(--brass); font-family:'Inter',sans-serif; font-size:14px; font-weight:700; padding:4px 10px; width:80px; text-align:right; outline:none; transition:border-color .2s; }
.num-input:focus { border-color:var(--brass); }

.divider { height:1px; background:var(--border); }

.insight { border:1px solid rgba(184,115,51,0.25); border-left:3px solid var(--brass); border-radius:10px; padding:14px 16px; font-size:13px; color:var(--text-dim); line-height:1.6; background:var(--brass-tint); }
.insight-green { border-color:rgba(74,222,128,0.2); border-left-color:var(--green); background:rgba(74,222,128,0.04); }

/* Bar chart */
.bar-wrap { display:flex; align-items:flex-end; gap:10px; height:130px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; }
.bar { width:100%; border-radius:5px 5px 0 0; min-height:4px; }
.bar-val { font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }
.bar-lbl { font-size:11px; color:var(--muted); font-weight:600; }

/* Grid helpers */
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media (max-width:680px) {
  .g2 { grid-template-columns:1fr; }
  .g3 { grid-template-columns:1fr; }
}
@media (max-width:860px) {
  .g3 { grid-template-columns:1fr 1fr; }
}

/* ── Print ── */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #181513 !important; }
  .no-print { display: none !important; }
  .print-only { display: block !important; }
}
.print-only { display: none; }
</style>
</head>
<body style="background:var(--raisin); color:var(--text); min-height:100vh;">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Constants ── */
const BASE_Y1    = 170000;
const RENEWAL    = 65000;
const KICKOFF    = 50000;
const CONV       = 0.05;
const LESSON     = 90;
const COMMISSION = 0.10;

/* ── Helpers ── */
const fmt  = (v, d=0) => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:d}).format(v);
const fmtK = v => {
  const a = Math.abs(v);
  if (a >= 1e6) return (v<0?'-':'') + '$' + (a/1e6).toFixed(1) + 'M';
  if (a >= 1000) return (v<0?'-':'') + '$' + Math.round(a/1000) + 'K';
  return fmt(v);
};
const clamp = (v,mn,mx) => Math.min(Math.max(v,mn),mx);

/* ── Discount / pricing ── */
function assocTier(n) {
  if (n >= 8) return { pct:10, label:'8+ branches → +10%' };
  if (n >= 4) return { pct:7,  label:'4–7 branches → +7%'  };
  if (n >= 2) return { pct:5,  label:'2–3 branches → +5%'  };
  return { pct:0, label:'Single branch (no tier bonus)' };
}

function calcDiscount(state) {
  if (state.pathway === 'waitlist') return 0;
  if (!state.pathway) return 0;
  const base = state.pathway === 'outright' ? 15 : 10;
  if (state.discountOverride) return Math.min(state.customDiscountPct || 0, 35) / 100;
  const tier    = assocTier(state.assocBranches || 1);
  const network = Math.min(state.networkBranches || 0, 10);
  return Math.min(base + tier.pct + network, 35) / 100;
}

function getPricing(state) {
  const disc    = calcDiscount(state);
  const y1total = Math.round(BASE_Y1 * (1 - disc));
  const renewal = Math.round(RENEWAL  * (1 - disc));
  const m1      = KICKOFF;
  const m4      = Math.max(0, y1total - m1);
  return { disc, y1total, renewal, m1, m4 };
}

/* ── Annual costs by year [0..4] ── */
function getYearCosts(state) {
  const { y1total, renewal } = getPricing(state);
  if (state.pathway === 'waitlist') return [0, 0, 0, RENEWAL, RENEWAL];
  if (state.pathway === 'donor')    return [0, 0, 0, renewal, renewal];
  return [y1total, renewal, renewal, renewal, renewal];
}

/* ── Revenue ── */
function calcRev(s) {
  const revGroup   = s.members * (s.groupPct/100)   * s.groupPrice  * 12;
  const revPrivate = s.members * (s.platformPct/100) * CONV * LESSON * COMMISSION * 12;
  const revMem     = s.members * s.memberLift * 12;
  return { revGroup, revPrivate, revMem, total: revGroup + revPrivate + revMem };
}

/* ── Break-even month for outright pathway ── */
function breakEvenMonth(annualRev, pricing) {
  const { m1, y1total } = pricing;
  if (annualRev <= 0) return null;
  const mo = annualRev / 12;
  for (let m = 1; m <= 60; m++) {
    const cumRev  = mo * m;
    const cumCost = m < 4 ? m1 : y1total;
    if (cumRev >= cumCost) return m;
  }
  return null;
}

/* ── Animated number ── */
function Num({ value, large=false }) {
  const [disp, setDisp] = useState(value);
  const [key,  setKey]  = useState(0);
  const prev = useRef(value);
  const raf  = useRef(null);
  useEffect(() => {
    const from = prev.current, to = value;
    if (from === to) return;
    prev.current = to;
    setKey(k => k+1);
    const t0 = performance.now(), dur = 480;
    const ease = t => 1 - Math.pow(1-t, 3);
    const tick = now => {
      const p = Math.min((now-t0)/dur, 1);
      setDisp(from + (to-from)*ease(p));
      if (p < 1) raf.current = requestAnimationFrame(tick);
      else setDisp(to);
    };
    cancelAnimationFrame(raf.current);
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [value]);
  return <span key={key} style={{display:'inline-block',animation:'countUp .2s ease both'}}>{large ? fmtK(disp) : fmt(disp)}</span>;
}

/* ── Progress ── */
function Progress({ step }) {
  const steps = [{n:1,label:'Your Branch'},{n:2,label:'Build Revenue'},{n:3,label:'5-Year Outlook'}];
  return (
    <div style={{display:'flex',alignItems:'center',width:'100%'}}>
      {steps.map((s,i) => (
        <React.Fragment key={s.n}>
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
            <div className={`pstep ${step>s.n?'done':step===s.n?'active':'idle'}`}>
              {step>s.n
                ? <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>
                : s.n}
            </div>
            <span style={{fontSize:11,fontWeight:600,color:step>=s.n?'rgba(255,255,255,.8)':'var(--muted)',whiteSpace:'nowrap'}}>{s.label}</span>
          </div>
          {i < steps.length-1 && <div className={`pline ${step>s.n?'done':''}`}/>}
        </React.Fragment>
      ))}
    </div>
  );
}

/* ── Slider row with number input ── */
function SliderRow({ label, value, min, max, step, onChange, format, hint, locked, lockNote }) {
  const pct = ((value-min)/(max-min)*100).toFixed(1);
  if (locked) return (
    <div style={{marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
        <label style={{fontSize:13,fontWeight:600,color:'rgba(255,255,255,.75)'}}>{label}</label>
        <span style={{fontSize:12,fontWeight:700,color:'var(--brass)',background:'var(--brass-tint)',border:'1px solid rgba(184,115,51,0.25)',borderRadius:6,padding:'3px 9px'}}>
          {format ? format(value) : fmt(value)} · locked
        </span>
      </div>
      {lockNote && <p style={{fontSize:11,color:'var(--muted)',lineHeight:1.5}}>{lockNote}</p>}
    </div>
  );
  return (
    <div style={{marginBottom:20}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <label style={{fontSize:13,fontWeight:600,color:'rgba(255,255,255,.75)'}}>{label}</label>
        <input
          className="num-input" type="number" min={min} max={max} step={step} value={value}
          onChange={e => { const v = parseFloat(e.target.value); if (!isNaN(v)) onChange(clamp(v,min,max)); }}
        />
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e => onChange(parseFloat(e.target.value))}
        style={{background:`linear-gradient(to right, var(--brass) ${pct}%, var(--border) ${pct}%)`}}
      />
      {hint && <p style={{fontSize:11,color:'var(--muted-light)',marginTop:5,lineHeight:1.5}}>{hint}</p>}
    </div>
  );
}

/* ══════════════════════════════════════════
   STEP 1 — Branch Profile & Pathway
══════════════════════════════════════════ */
function Step1({ state, setState, onNext }) {
  const set = k => v => setState(p => ({...p,[k]:v}));
  const canNext = state.assocName.trim() && state.branchName.trim() && state.pathway;

  const pricing = state.pathway ? getPricing(state) : null;
  const tier    = assocTier(state.assocBranches || 1);
  const netBonus = Math.min(state.networkBranches || 0, 10);
  const pathwayBase = state.pathway === 'outright' ? 15 : state.pathway === 'donor' ? 10 : 0;
  const autoDiscPct = state.pathway && state.pathway !== 'waitlist'
    ? Math.min(pathwayBase + tier.pct + netBonus, 35)
    : 0;
  const showDiscCalc = state.pathway === 'donor' || state.pathway === 'outright';

  const lbl = {fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted-light)',display:'block',marginBottom:8};

  const pwCheck = (id, color) => (
    <div style={{width:20,height:20,borderRadius:'50%',
      border:`2px solid ${state.pathway===id?color:'var(--border)'}`,
      background:state.pathway===id?color:'transparent',
      display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all .2s'}}>
      {state.pathway===id && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--raisin)" strokeWidth="3.5"><polyline points="20 6 9 17 4 12"/></svg>}
    </div>
  );

  return (
    <div className="fade-up" style={{maxWidth:680,margin:'0 auto'}}>
      <div style={{marginBottom:6}}>
        <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.12em',color:'var(--muted-light)',marginBottom:6}}>Step 1 of 3</div>
        <div style={{fontSize:24,fontWeight:900,color:'var(--text)',letterSpacing:'-.01em',marginBottom:4}}>Your Branch Profile</div>
        <div style={{fontSize:14,color:'var(--text-dim)',lineHeight:1.6}}>Enter the branch details and confirm the funding pathway.</div>
      </div>

      <div className="divider" style={{margin:'22px 0'}}/>

      {/* Profile fields */}
      <div className="g2" style={{marginBottom:14}}>
        <div>
          <label style={lbl}>Association Name</label>
          <input className="field" placeholder="e.g. YMCA of Greater Seattle"
            value={state.assocName} onChange={e => set('assocName')(e.target.value)}/>
        </div>
        <div>
          <label style={lbl}>Branch Name</label>
          <input className="field" placeholder="e.g. Downtown Branch"
            value={state.branchName} onChange={e => set('branchName')(e.target.value)}/>
        </div>
      </div>
      <div className="g2" style={{marginBottom:26}}>
        <div>
          <label style={lbl}>Executive Contact <span style={{fontWeight:400,textTransform:'none',letterSpacing:0,color:'var(--muted)'}}>— optional</span></label>
          <input className="field" placeholder="Name and title"
            value={state.execName} onChange={e => set('execName')(e.target.value)}/>
        </div>
        <div>
          <label style={lbl}>Members at this Branch</label>
          <input className="field" type="number" min={100} placeholder="4,230"
            value={state.members}
            onChange={e => { const v = parseInt(e.target.value); if (!isNaN(v) && v > 0) set('members')(v); }}/>
          <p style={{fontSize:12,color:'var(--muted)',marginTop:6}}>National avg: 4,230 members/branch.</p>
        </div>
      </div>

      {/* ── Pathway cards ── */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted-light)',marginBottom:12}}>Funding Pathway</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>

          {/* Waitlist */}
          <div className={`pw-card ${state.pathway==='waitlist'?'sel-waitlist':''}`}
            style={{flex:'1 1 180px'}} onClick={() => set('pathway')('waitlist')}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
              <span style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',
                color:'var(--cerulean-light)',background:'var(--cerulean-tint)',border:'1px solid rgba(53,94,141,0.3)',
                borderRadius:6,padding:'3px 8px'}}>Waitlist · PM Sources Donor</span>
              {pwCheck('waitlist','var(--cerulean-light)')}
            </div>
            <div style={{fontSize:16,fontWeight:800,color:'var(--text)',marginBottom:4}}>Waitlist</div>
            <div style={{fontSize:12,color:'var(--text-dim)',lineHeight:1.5,marginBottom:12}}>
              Sign an LOI — PM matches you with a donor from our network. No fundraising required.
            </div>
            <div className="divider" style={{marginBottom:10}}/>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {[['Years 1–3','$0 — PM-sourced donor'],['Year 4+ renewal',fmt(RENEWAL)+'/yr'],['Discount','Standard rate']].map(([l,v],i) => (
                <div key={l} style={{display:'flex',justifyContent:'space-between',fontSize:12}}>
                  <span style={{color:'var(--muted-light)'}}>{l}</span>
                  <span style={{fontWeight:700,color:i===0?'var(--cerulean-light)':'var(--text)'}}>{v}</span>
                </div>
              ))}
            </div>
          </div>

          {/* BYOD */}
          <div className={`pw-card ${state.pathway==='donor'?'sel-donor':''}`}
            style={{flex:'1 1 180px'}} onClick={() => set('pathway')('donor')}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
              <span style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',
                color:'var(--green)',background:'rgba(74,222,128,0.08)',border:'1px solid rgba(74,222,128,0.2)',
                borderRadius:6,padding:'3px 8px'}}>Bring Your Own Donor</span>
              {pwCheck('donor','var(--green)')}
            </div>
            <div style={{fontSize:16,fontWeight:800,color:'var(--text)',marginBottom:4}}>Your Donor Network</div>
            <div style={{fontSize:12,color:'var(--text-dim)',lineHeight:1.5,marginBottom:12}}>
              Your association sources the donor. Earn stacked discounts based on size and network participation.
            </div>
            <div className="divider" style={{marginBottom:10}}/>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {[['Years 1–3','$0 — your donor covers it'],['Base pathway discount','10% off'],['+ Association & network','stacked discounts']].map(([l,v],i) => (
                <div key={l} style={{display:'flex',justifyContent:'space-between',fontSize:12}}>
                  <span style={{color:'var(--muted-light)'}}>{l}</span>
                  <span style={{fontWeight:700,color:i===0?'var(--green)':'var(--text)'}}>{v}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Outright */}
          <div className={`pw-card ${state.pathway==='outright'?'sel-outright':''}`}
            style={{flex:'1 1 180px'}} onClick={() => set('pathway')('outright')}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
              <span style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',

            </div>
            <div className="divider" style={{marginBottom:10}}/>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>

          {/* Pathway base row */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}}>
            <div>
              <div style={{fontSize:13,color:'var(--text)'}}>Pathway discount</div>

                {state.pathway==='outright' ? 'Branch Self-Pay — 15% off, every year' : 'Bring Your Own Donor pathway'}

          {/* Association tier — 4 cards */}

            <div style={{fontSize:13,color:'var(--text)',marginBottom:2}}>Are other branches signing this quarter?</div>
            <div style={{fontSize:11,color:'var(--muted)',marginBottom:10}}>Multi-branch commitments stack on top of your pathway discount.</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
              {[
                {label:'Just this branch', val:1,  pct:0},
                {label:'2–3 branches',     val:2,  pct:5},
                {label:'4–7 branches',     val:4,  pct:7},
                {label:'8+ branches',      val:8,  pct:10, max:true},
              ].map(opt => {
                const sel = (state.assocBranches||1) === opt.val;
                return (
                  <div key={opt.val}

                      borderRadius:10, padding:'10px 8px', textAlign:'center', cursor:'pointer',
                      background:sel?'var(--brass-tint)':'var(--raisin)',
                      transition:'all .15s',
                    }}>
                    <div style={{fontSize:10,color:sel?'var(--brass)':'var(--text-dim)',marginBottom:4,lineHeight:1.4,fontWeight:600}}>
                      {opt.label}{opt.max&&<span style={{fontSize:9,color:'var(--muted)',marginLeft:3}}>MAX</span>}
                    </div>
                    <div style={{fontSize:17,fontWeight:900,color:sel?'var(--brass)':opt.pct>0?'var(--text)':'var(--muted)'}}>
                      +{opt.pct}%
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Network bonus row */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}}>
            <div style={{flex:1}}>
              <div style={{fontSize:13,color:'var(--text)'}}>Donor-network bonus</div>
              <div style={{fontSize:11,color:'var(--muted)',marginTop:2,marginBottom:8}}>1% per branch contributing to shared donor campaign (max 10%)</div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:12,color:'var(--muted-light)'}}>Network branches:</span>
                <input type="number" min={0} max={10} value={state.networkBranches||0}
                  onChange={e=>{const v=parseInt(e.target.value);if(!isNaN(v)&&v>=0)set('networkBranches')(v);}}
                  className="num-input" style={{width:64}}
                  onClick={e=>e.stopPropagation()}/>
              </div>
            </div>
            <span style={{fontSize:15,fontWeight:700,color:netBonus>0?'var(--green)':'var(--muted)',whiteSpace:'nowrap',marginLeft:12}}>
              +{netBonus}%
            </span>
          </div>

          <div className="divider" style={{margin:'4px 0 14px'}}/>

          {/* Total row */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>Total Discount</div>
              {state.discountOverride && <div style={{fontSize:11,color:'var(--brass)',marginTop:2}}>Manual override active</div>}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              {state.discountOverride ? (
                <>
                  <input type="number" min={0} max={35} step={0.5} value={state.customDiscountPct||0}
                    onChange={e=>{const v=parseFloat(e.target.value);if(!isNaN(v))set('customDiscountPct')(Math.min(v,35));}}
                    className="num-input" style={{width:70}}
                    onClick={e=>e.stopPropagation()}/>
                  <span style={{fontSize:13,color:'var(--muted)'}}>%</span>
                  <button className="btn-ghost" style={{padding:'4px 12px',fontSize:12}}
                    onClick={e=>{e.stopPropagation();set('discountOverride')(false);}}>Auto</button>
                </>
              ) : (
                <>
                  <span style={{fontSize:24,fontWeight:900,color:'var(--green)'}}>{autoDiscPct}%</span>
                  <button className="btn-ghost" style={{padding:'4px 12px',fontSize:12}}
                    onClick={e=>{e.stopPropagation();setState(p=>({...p,discountOverride:true,customDiscountPct:autoDiscPct}));}}>Edit</button>
                </>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ── Investment Summary ── */}
      {state.pathway && pricing && (
        <div className="inner fade-up" style={{
          padding:'18px 20px',marginBottom:26,
          border:`1px solid ${state.pathway==='outright'?'rgba(184,115,51,0.2)':state.pathway==='donor'?'rgba(74,222,128,0.15)':'rgba(53,94,141,0.2)'}`,
          borderRadius:14,
        }}>
          <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted-light)',marginBottom:14}}>Your Investment Summary</div>

          {state.pathway === 'outright' && (
            <>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:10}}>
                <span style={{fontSize:15,fontWeight:700,color:'var(--text)'}}>Year 1 Program Fee</span>
                <span style={{fontSize:22,fontWeight:900,color:'var(--brass)',fontVariantNumeric:'tabular-nums'}}>{fmt(pricing.y1total)}</span>
              </div>
              <div style={{fontSize:12,color:'var(--muted)',marginBottom:10}}>
                {(pricing.disc*100).toFixed(0)}% total discount applied · saves {fmt(Math.round(BASE_Y1*pricing.disc))} vs. standard
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:5,paddingLeft:12,marginBottom:12}}>
                {[['Month 1 (kickoff)',fmt(pricing.m1)],['Month 4 (balance)',fmt(pricing.m4)]].map(([l,v]) => (
                  <div key={l} style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
                    <span style={{color:'var(--muted-light)'}}>{l}</span>
                    <span style={{fontWeight:600}}>{v}</span>
                  </div>
                ))}
              </div>
              <div className="divider" style={{marginBottom:10}}/>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
                <span style={{color:'var(--text-dim)'}}>Year 2+ Renewal ({(pricing.disc*100).toFixed(0)}% off, every year)</span>
                <span style={{fontWeight:700,color:'var(--text)'}}>{fmt(pricing.renewal)}/yr</span>
              </div>
            </>
          )}

          {state.pathway === 'donor' && (
            <>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <span style={{fontSize:13,color:'var(--text-dim)'}}>Years 1–3 cost to your branch</span>
                <span style={{fontSize:20,fontWeight:900,color:'var(--green)'}}>$0 / yr</span>
              </div>
              <div style={{fontSize:12,color:'var(--muted)',marginBottom:12,lineHeight:1.6}}>
                Your donor commits <strong style={{color:'var(--text)'}}>{fmt(pricing.y1total + pricing.renewal * 2)}</strong> over 3 years at the {(pricing.disc*100).toFixed(0)}% discounted rate
                <span style={{color:'var(--text-dim)'}}> · saves {fmt(Math.round((BASE_Y1+RENEWAL*2)*(pricing.disc)))} vs. standard</span>
              </div>
              <div className="divider" style={{marginBottom:10}}/>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
                <span style={{color:'var(--text-dim)'}}>Year 4+ Renewal (self-funded, {(pricing.disc*100).toFixed(0)}% off)</span>
                <span style={{fontWeight:700,color:'var(--text)'}}>{fmt(pricing.renewal)}/yr</span>
              </div>
            </>
          )}

          {state.pathway === 'waitlist' && (
            <>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <span style={{fontSize:13,color:'var(--text-dim)'}}>Years 1–3 cost to your branch</span>
                <span style={{fontSize:20,fontWeight:900,color:'var(--cerulean-light)'}}>$0 / yr</span>
              </div>
              <div style={{fontSize:12,color:'var(--muted)',marginBottom:12,lineHeight:1.6}}>
                PM matches your branch with a donor from our network — no fundraising required on your end.
              </div>
              <div className="divider" style={{marginBottom:10}}/>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
                <span style={{color:'var(--text-dim)'}}>Year 4+ Renewal (standard rate)</span>
                <span style={{fontWeight:700,color:'var(--text)'}}>{fmt(RENEWAL)}/yr</span>
              </div>
            </>
          )}
        </div>
      )}

      <div style={{display:'flex',justifyContent:'flex-end'}}>
        <button className="btn" onClick={onNext} disabled={!canNext}>
          Build Your Revenue →
        </button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   STEP 2 — Revenue Builder + Break-Even
══════════════════════════════════════════ */
function Step2({ state, setState, onNext, onBack }) {
  const set = k => v => setState(p => ({...p,[k]:v}));
  const rev     = calcRev(state);
  const costs   = getYearCosts(state);
  const pricing = getPricing(state);
  const mo      = rev.total / 12;
  const isOut   = state.pathway === 'outright';
  const isCovered = state.pathway === 'donor' || state.pathway === 'waitlist';

  const pathwayLabel = state.pathway === 'outright' ? 'Branch Self-Pay'
    : state.pathway === 'donor' ? 'Bring Your Own Donor'
    : 'Waitlist · PM-Sourced';
  const pathwayColor = state.pathway === 'outright' ? 'var(--brass)'
    : state.pathway === 'donor' ? 'var(--green)'
    : 'var(--cerulean-light)';

  /* Break-even display */
  let beLabel, beSub, beColor;
  if (isOut) {
    const bem = breakEvenMonth(rev.total, pricing);
    if (!bem)        { beLabel='Never';         beSub='Increase revenue to break even';               beColor='var(--negative)'; }
    else if (bem<=12){ beLabel=`Month ${bem}`;  beSub=`Within Year 1 — ${12-bem} months of surplus`;  beColor='var(--brass-light)'; }
    else             { beLabel=`Month ${bem}`;  beSub=`Year ${Math.ceil(bem/12)} — try growing revenue`; beColor='var(--text)'; }
  } else {
    const y4cost    = costs[3];
    const y4surplus = rev.total - y4cost;
    if (rev.total <= 0) {
      beLabel = '—';
      beSub   = 'Add revenue to see Year 4 outlook';
      beColor = 'var(--muted)';
    } else if (y4surplus >= 0) {
      beLabel = `+${fmtK(y4surplus)}/yr`;
      beSub   = `Annual surplus after ${fmt(y4cost)} renewal`;
      beColor = 'var(--positive)';
    } else {
      const moToBreak = Math.ceil(y4cost / mo);
      beLabel = `Month ${moToBreak} of Yr 4`;
      beSub   = `Gap: ${fmtK(-y4surplus)}/yr — grow revenue to close it`;
      beColor = 'var(--negative)';
    }
  }

  const y1net = rev.total - costs[0];
  const kpi2val   = isOut ? y1net : rev.total * 3;
  const kpi2label = isOut ? 'Year 1 Net' : '3-Year Surplus';
  const kpi2color = kpi2val >= 0 ? 'var(--positive)' : 'var(--negative)';

  return (
    <div className="slide-in">
      <div style={{display:'flex',alignItems:'baseline',gap:10,marginBottom:6,flexWrap:'wrap'}}>
        <div style={{fontSize:22,fontWeight:800,color:'var(--text)',letterSpacing:'-.01em'}}>
          {state.branchName || state.assocName} — Revenue Builder
        </div>
        <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.12em',color:pathwayColor}}>
          {pathwayLabel}
        </div>
      </div>
      <div style={{fontSize:13,color:'var(--text-dim)',marginBottom:14}}>Adjust the sliders to model revenue. Break-even updates live as you go.</div>

      {/* Live KPI strip */}
      <div className="kpi-strip" style={{marginBottom:22}}>
        <div className="kpi-cell">
          <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--text-faint)',marginBottom:4}}>Annual Revenue</div>
          <div style={{fontSize:26,fontWeight:900,color:'var(--text)',fontVariantNumeric:'tabular-nums'}}><Num value={rev.total} large/></div>
          <div style={{fontSize:11,color:'var(--muted-light)',marginTop:5,lineHeight:1.4}}>
            vs. <span style={{color:'var(--text-dim)',fontWeight:600}}>{fmtK(costs[isOut?1:3])}/yr</span>
            {' '}{isOut ? 'Yr 2+ renewal' : 'Yr 4+ renewal'}
          </div>
        </div>
        <div className="kpi-cell">
          <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--text-faint)',marginBottom:4}}>{kpi2label}</div>
          <div style={{fontSize:26,fontWeight:900,color:kpi2color,fontVariantNumeric:'tabular-nums'}}><Num value={kpi2val} large/></div>
        </div>
        <div className="kpi-cell">
          <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--text-faint)',marginBottom:4}}>
            {isOut ? 'Break-Even' : 'Year 4 Surplus'}
          </div>
          <div style={{fontSize:20,fontWeight:900,color:beColor,marginBottom:3}}>{beLabel}</div>
          <div style={{fontSize:11,color:'var(--text-faint)',lineHeight:1.4}}>{beSub}</div>
        </div>
      </div>

      {/* Three revenue stream cards */}
      <div className="g3" style={{marginBottom:18}}>

        {/* Group Classes */}
        <div className="stream">
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:14}}>
            <div style={{width:32,height:32,borderRadius:8,background:'var(--cerulean-tint)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--cerulean-light)" strokeWidth="2.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            </div>
            <div>
              <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)'}}>Group Classes</div>
              <div style={{fontSize:17,fontWeight:900,color:rev.revGroup>0?'var(--positive)':'var(--text-dim)',fontVariantNumeric:'tabular-nums'}}>
                <Num value={rev.revGroup}/><span style={{fontSize:11,fontWeight:500,color:'var(--muted)',marginLeft:3}}>/yr</span>
              </div>
            </div>
          </div>
          <SliderRow label="Participation %" value={state.groupPct} min={0} max={25} step={0.5}
            onChange={set('groupPct')} format={v=>`${v.toFixed(1)}%`}
            hint={`${Math.round(state.members*state.groupPct/100).toLocaleString()} of ${state.members.toLocaleString()} members`}/>
          <SliderRow label="Price / month" value={state.groupPrice} min={20} max={200} step={5}
            onChange={set('groupPrice')} format={v=>`$${v}`}
            hint={`$${(state.groupPrice*12).toLocaleString()} per participant annually`}/>
        </div>

        {/* Private Lessons */}
        <div className="stream">
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:14}}>
            <div style={{width:32,height:32,borderRadius:8,background:'rgba(94,234,212,0.08)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--positive)" strokeWidth="2.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </div>
            <div>
              <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)'}}>Private Lessons</div>
              <div style={{fontSize:17,fontWeight:900,color:rev.revPrivate>0?'var(--positive)':'var(--text-dim)',fontVariantNumeric:'tabular-nums'}}>
                <Num value={rev.revPrivate}/><span style={{fontSize:11,fontWeight:500,color:'var(--muted)',marginLeft:3}}>/yr</span>
              </div>
            </div>
          </div>
          <SliderRow label="Platform reach %" value={state.platformPct} min={0} max={40} step={1}
            onChange={set('platformPct')} format={v=>`${v}%`}
            hint={`${Math.round(state.members*state.platformPct/100)} members → ${Math.round(state.members*state.platformPct/100*CONV)} take lessons`}/>
          <SliderRow label="YMCA commission" value={COMMISSION*100} min={10} max={10} step={0}
            onChange={()=>{}} format={v=>`${v}%`} locked
            lockNote="Fixed at 10% per partnership agreement."/>
        </div>

        {/* Membership Lift */}
        <div className="stream">
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:14}}>
            <div style={{width:32,height:32,borderRadius:8,background:'var(--brass-tint)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--brass)" strokeWidth="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div>
              <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)'}}>Membership Lift</div>
              <div style={{fontSize:17,fontWeight:900,color:rev.revMem>0?'var(--positive)':'var(--text-dim)',fontVariantNumeric:'tabular-nums'}}>
                <Num value={rev.revMem}/><span style={{fontSize:11,fontWeight:500,color:'var(--muted)',marginLeft:3}}>/yr</span>
              </div>
            </div>
          </div>
          <SliderRow label="Price lift / member / mo" value={state.memberLift} min={0} max={15} step={0.5}
            onChange={set('memberLift')} format={v=>v>0?`$${v.toFixed(2)}/mo`:'$0'}
            hint={state.memberLift>0
              ? `${state.members.toLocaleString()} × $${state.memberLift.toFixed(2)} × 12 = ${fmt(rev.revMem)}`
              : 'Optional — tie a monthly increase to the music program'}/>
        </div>

      </div>

      {/* Insight */}
      {isOut && (
        <div className="insight" style={{marginBottom:18}}>
          {y1net >= 0
            ? <><strong>Year 1 profitable.</strong> At these numbers the program returns <strong>{fmtK(y1net)}</strong> after covering your {fmt(pricing.y1total)} investment — and the gap widens every year.</>
            : <><strong>Not yet covering costs.</strong> You need <strong>{fmtK(costs[0]-rev.total)}</strong> more in annual revenue to break even in Year 1. Try increasing group class participation.</>
          }
        </div>
      )}
      {state.pathway === 'donor' && (
        <div className="insight insight-green" style={{marginBottom:18}}>
          <strong>3-year head start — your donor covers it all.</strong> With a {fmt(pricing.y1total+pricing.renewal*2)} donor commitment at {(pricing.disc*100).toFixed(0)}% off,
          every dollar earned in Years 1–3 is pure surplus — <strong>{fmtK(rev.total*3)}</strong> accumulated before your first {fmt(pricing.renewal)} renewal in Year 4.
          {rev.total >= pricing.renewal
            ? <> Year 4 is self-sustaining with <strong>{fmtK(rev.total-pricing.renewal)}</strong> annual surplus.</>
            : <> Grow annual revenue to {fmt(pricing.renewal)} to be fully self-sustaining by Year 4.</>
          }
        </div>
      )}
      {state.pathway === 'waitlist' && (
        <div className="insight" style={{marginBottom:18,borderLeftColor:'var(--cerulean)',background:'var(--cerulean-tint)',borderColor:'rgba(53,94,141,0.25)'}}>
          <strong>PM sources your donor.</strong> Once matched, your branch runs cost-free for 3 full years — <strong>{fmtK(rev.total*3)}</strong> in accumulated surplus before the {fmt(RENEWAL)}/yr renewal kicks in from Year 4.
          {rev.total >= RENEWAL
            ? <> Year 4 is self-sustaining with <strong>{fmtK(rev.total-RENEWAL)}</strong> annual surplus.</>
            : <> Grow annual revenue to {fmt(RENEWAL)} to be self-sustaining from Year 4.</>
          }
        </div>
      )}

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}}>
        <button className="btn-ghost" onClick={onBack}>← Back</button>
        <button className="btn" onClick={onNext}>See the 5-Year Outlook →</button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   STEP 3 — 5-Year Projection
══════════════════════════════════════════ */
function Step3({ state, onBack, onReset }) {
  const rev     = calcRev(state);
  const costs   = getYearCosts(state);
  const pricing = getPricing(state);
  const isOut   = state.pathway === 'outright';
  const isCovered = state.pathway === 'donor' || state.pathway === 'waitlist';
  const [shown, setShown] = useState(false);
  useEffect(() => { const t = setTimeout(() => setShown(true), 120); return () => clearTimeout(t); }, []);

  const years = [1,2,3,4,5].map((yr,i) => {
    const cost = costs[i];
    const net  = rev.total - cost;
    return { yr, cost, net };
  });
  const cumNets = years.reduce((acc,y,i) => [...acc, (acc[i-1]||0)+y.net], []);
  const cum5    = cumNets[4];
  const maxAbs  = Math.max(...years.map(y => Math.abs(y.net)), 1);
  const barH    = v => Math.max(4, (Math.abs(v)/maxAbs)*115);

  /* Month-by-month Year 1 cash flow (outright only) */
  const cashFlow = isOut ? Array.from({length:12},(_,i) => {
    const m       = i+1;
    const cumRev  = (rev.total/12) * m;
    const cumCost = m < 4 ? pricing.m1 : pricing.y1total;
    const pmt     = m===1 ? pricing.m1 : m===4 ? pricing.m4 : 0;
    const prevBE  = i > 0 && (rev.total/12)*(m-1) >= (m-1<4?pricing.m1:pricing.y1total);
    return { m, cumRev, cumCost, net: cumRev-cumCost, pmt, isBE: cumRev>=cumCost && !prevBE };
  }) : null;

  const branchLabel = [state.branchName, state.assocName].filter(Boolean).join(' · ');

  return (
    <div className="slide-in">

      {/* Hero banner */}
      <div style={{
        background:'linear-gradient(135deg, var(--raisin-deep) 0%, #0c1428 55%, #0d1a30 100%)',
        border:'1px solid var(--border)',borderRadius:20,padding:'28px 32px',marginBottom:20,
        position:'relative',overflow:'hidden',boxShadow:'0 8px 32px rgba(0,0,0,0.4)',
      }}>
        <div style={{position:'absolute',top:-80,right:-80,width:280,height:280,borderRadius:'50%',background:'radial-gradient(circle, rgba(184,115,51,0.13), transparent 65%)',pointerEvents:'none'}}/>
        <div style={{position:'absolute',bottom:-60,left:-60,width:200,height:200,borderRadius:'50%',background:'radial-gradient(circle, rgba(53,94,141,0.1), transparent 65%)',pointerEvents:'none'}}/>
        <div style={{position:'relative'}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.13em',color:'var(--text-faint)',marginBottom:4}}>
            5-Year Outlook · {branchLabel}
          </div>
          <div style={{fontFamily:'Lora, Georgia, serif',fontStyle:'italic',fontSize:14,color:'var(--text-dim)',marginBottom:10}}>
            {isOut ? 'Investment recovery and long-term program surplus' : '3-year donor-covered head start, self-sustaining from Year 4'}
          </div>
          <div style={{fontSize:44,fontWeight:900,color:cum5>=0?'var(--positive)':'var(--negative)',fontVariantNumeric:'tabular-nums',letterSpacing:'-.02em',marginBottom:6}}>
            {shown ? fmtK(cum5) : '—'}
          </div>
          <div style={{fontSize:13,color:'var(--text-dim)',marginBottom:22}}>cumulative net over 5 years, after all program costs</div>
          <div className="g3">
            {[
              { label:'Annual Revenue',    val:rev.total,                                   raw:null,    color:'var(--text)' },
              { label:isOut?'Year 1 Net':'3-Year Surplus', val:isOut?years[0].net:rev.total*3, raw:null, color:(isOut?years[0].net:rev.total*3)>=0?'var(--positive)':'var(--negative)' },
              { label:'Year 4 Surplus',    val:rev.total-costs[3],                          raw:null,    color:rev.total>=costs[3]?'var(--positive)':'var(--negative)' },
            ].map(k => (
              <div key={k.label} style={{background:'rgba(255,255,255,0.04)',borderRadius:12,padding:'14px 16px'}}>
                <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--text-faint)',marginBottom:5}}>{k.label}</div>
                <div style={{fontSize:18,fontWeight:900,color:k.color,fontVariantNumeric:'tabular-nums',letterSpacing:'-.01em'}}>
                  {k.raw ? k.raw : shown ? fmtK(k.val) : '—'}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Bar chart + 5-year table */}
      <div className="g2" style={{marginBottom:16}}>

        <div className="card" style={{padding:22}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--text)',marginBottom:3}}>Year-by-Year Net Return</div>
          <div style={{fontSize:11,color:'var(--muted-light)',marginBottom:22}}>Revenue minus program cost</div>
          <div className="bar-wrap" style={{paddingTop:8}}>
            {years.map((y,i) => (
              <div key={y.yr} className="bar-col">
                <div className="bar-val" style={{color:y.net>=0?'var(--positive)':'var(--negative)'}}>{fmtK(y.net)}</div>
                <div className="bar" style={{
                  height: shown ? barH(y.net) : 4,
                  background: y.net>=0
                    ? 'linear-gradient(to top, #3D9970, var(--positive))'
                    : 'linear-gradient(to top, #b91c1c, var(--negative))',
                  transition:`height .5s cubic-bezier(.34,1.56,.64,1) ${i*.07}s`,
                }}/>
                <div className="bar-lbl">Yr {y.yr}</div>
              </div>
            ))}
          </div>
          <div className="divider" style={{margin:'14px 0'}}/>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12}}>
            <span style={{color:'var(--muted-light)'}}>5-year cumulative net</span>
            <span style={{fontWeight:700,color:cum5>=0?'var(--positive)':'var(--negative)'}}>{fmtK(cum5)}</span>
          </div>
        </div>

        <div className="card" style={{padding:22}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--text)',marginBottom:14}}>Annual Breakdown</div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead>
              <tr>{['Year','Revenue','Cost','Net','Cumul.'].map(h => (
                <th key={h} style={{textAlign:h==='Year'?'left':'right',padding:'3px 5px 8px',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--muted)',borderBottom:'1px solid var(--border)'}}>{h}</th>
              ))}</tr>
            </thead>
            <tbody>
              {years.map((y,i) => {
                const note = isCovered && y.yr<=3
                  ? (state.pathway==='donor' ? 'Your Donor' : 'PM-Sourced')
                  : y.yr===1 && isOut ? `${Math.round(pricing.disc*100)}% off`
                  : 'Renewal';
                const noteColor = isCovered && y.yr<=3
                  ? (state.pathway==='donor' ? 'var(--green)' : 'var(--cerulean-light)')
                  : 'var(--muted)';
                return (
                  <tr key={y.yr} style={{borderBottom:'1px solid rgba(58,53,50,0.45)'}}>
                    <td style={{padding:'8px 5px',fontWeight:700}}>
                      Yr {y.yr}
                      <div style={{fontSize:10,color:noteColor,fontWeight:500,marginTop:1}}>{note}</div>
                    </td>
                    <td style={{padding:'8px 5px',textAlign:'right',fontVariantNumeric:'tabular-nums'}}>{fmtK(rev.total)}</td>
                    <td style={{padding:'8px 5px',textAlign:'right',fontVariantNumeric:'tabular-nums',color:y.cost===0?'var(--green)':'var(--text-dim)'}}>{y.cost===0?'$0':fmtK(y.cost)}</td>
                    <td style={{padding:'8px 5px',textAlign:'right',fontWeight:700,fontVariantNumeric:'tabular-nums',color:y.net>=0?'var(--positive)':'var(--negative)'}}>{fmtK(y.net)}</td>
                    <td style={{padding:'8px 5px',textAlign:'right',fontWeight:700,fontVariantNumeric:'tabular-nums',color:cumNets[i]>=0?'var(--positive)':'var(--negative)'}}>{fmtK(cumNets[i])}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

      </div>

      {/* Year 1 monthly cash flow — outright only */}
      {cashFlow && (
        <div className="card" style={{padding:22,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--text)',marginBottom:3}}>Year 1 Monthly Cash Flow</div>
          <div style={{fontSize:11,color:'var(--muted-light)',marginBottom:14}}>Cumulative revenue vs. program payments — break-even month starred</div>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:520}}>
              <thead>
                <tr>{['Month','Payment','Cum. Revenue','Cum. Cost','Net Position'].map(h => (
                  <th key={h} style={{textAlign:h==='Month'?'left':'right',padding:'3px 7px 8px',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--muted)',borderBottom:'1px solid var(--border)'}}>{h}</th>
                ))}</tr>
              </thead>
              <tbody>
                {cashFlow.map(r => (
                  <tr key={r.m} style={{borderBottom:'1px solid rgba(58,53,50,0.4)',background:r.isBE?'rgba(184,115,51,0.07)':'transparent'}}>
                    <td style={{padding:'7px 7px',fontWeight:600,color:r.isBE?'var(--brass)':'var(--text)'}}>Mo {r.m}{r.isBE?' ★':''}</td>
                    <td style={{padding:'7px 7px',textAlign:'right',color:r.pmt>0?'var(--negative)':'var(--muted)'}}>{r.pmt>0?`-${fmt(r.pmt)}`:'—'}</td>
                    <td style={{padding:'7px 7px',textAlign:'right',fontVariantNumeric:'tabular-nums'}}>{fmt(r.cumRev)}</td>
                    <td style={{padding:'7px 7px',textAlign:'right',fontVariantNumeric:'tabular-nums',color:'var(--text-dim)'}}>{fmt(r.cumCost)}</td>
                    <td style={{padding:'7px 7px',textAlign:'right',fontWeight:700,fontVariantNumeric:'tabular-nums',color:r.net>=0?'var(--positive)':'var(--negative)'}}>{fmtK(r.net)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* 3-year head start summary — shown for donor and waitlist */}
      {isCovered && (
        <div className="card" style={{padding:22,marginBottom:16,
          border:`1px solid ${state.pathway==='donor'?'rgba(74,222,128,0.18)':'rgba(53,94,141,0.2)'}`,
          background:state.pathway==='donor'?'rgba(74,222,128,0.03)':'rgba(53,94,141,0.05)'}}>
          <div style={{fontSize:13,fontWeight:700,color:state.pathway==='donor'?'var(--green)':'var(--cerulean-light)',marginBottom:12}}>
            Your 3-Year Head Start
            {state.pathway==='donor' && pricing.disc>0 && <span style={{marginLeft:8,fontSize:11,fontWeight:500,color:'var(--muted)'}}>({(pricing.disc*100).toFixed(0)}% discount applied)</span>}
          </div>
          <div className="g3">
            {[
              { label:'Surplus by end of Year 3', val:rev.total*3,               color:state.pathway==='donor'?'var(--green)':'var(--cerulean-light)' },
              { label:'Year 4 renewal (first cost)', val:costs[3],               color:'var(--text-dim)' },
              { label:'Annual surplus from Year 4',  val:rev.total-costs[3],     color:rev.total>=costs[3]?'var(--positive)':'var(--negative)' },
            ].map(k => (
              <div key={k.label} style={{background:'rgba(255,255,255,0.03)',borderRadius:10,padding:'12px 14px'}}>
                <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',marginBottom:6}}>{k.label}</div>
                <div style={{fontSize:18,fontWeight:900,color:k.color,fontVariantNumeric:'tabular-nums'}}>{fmtK(k.val)}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Actions */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}} className="no-print">
        <button className="btn-ghost" onClick={onBack}>← Adjust Revenue</button>
        <div style={{display:'flex',gap:10}}>
          <button className="btn-ghost" onClick={onReset}>Start Over</button>
          <button className="btn" onClick={() => window.print()}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Download Summary
          </button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   PRINT SUMMARY (hidden — print only)
══════════════════════════════════════════ */
function PrintSummary({ state }) {
  if (!state.pathway) return null;
  const rev     = calcRev(state);
  const costs   = getYearCosts(state);
  const pricing = getPricing(state);
  const isOut   = state.pathway === 'outright';
  const isCovered = state.pathway === 'donor' || state.pathway === 'waitlist';
  const years   = [1,2,3,4,5].map((yr,i) => ({ yr, cost:costs[i], net:rev.total-costs[i] }));
  const cumNets = years.reduce((acc,y,i) => [...acc,(acc[i-1]||0)+y.net],[]);
  const bem     = isOut ? breakEvenMonth(rev.total, pricing) : null;
  const today   = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

  const row = (l,v,bold=false,color='inherit') => (
    <div style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid #3A3532',fontSize:13}}>
      <span style={{color:'#9aa3af'}}>{l}</span>
      <span style={{fontWeight:bold?700:500,color}}>{v}</span>
    </div>
  );

  return (
    <div style={{padding:40,maxWidth:760,margin:'0 auto',fontFamily:'Inter,sans-serif',color:'#fff',background:'#181513'}}>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:28}}>
        <div>
          <div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:'.12em',color:'#B87333',marginBottom:4}}>Practicing Musician × YMCA</div>
          <div style={{fontSize:24,fontWeight:900,letterSpacing:'-.01em'}}>Branch ROI Summary</div>
        </div>
        <div style={{textAlign:'right',fontSize:12,color:'#9aa3af'}}>
          <div style={{fontWeight:700,color:'#fff'}}>{state.branchName}</div>
          <div>{state.assocName}</div>
          <div style={{marginTop:4}}>{today}</div>
        </div>
      </div>

      <div style={{height:2,background:'#B87333',marginBottom:24,opacity:.4}}/>

      {/* Branch + Pathway */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:24}}>
        <div style={{background:'#2C2623',border:'1px solid #3A3532',borderRadius:12,padding:'16px 18px'}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'#6B7280',marginBottom:10}}>Branch Details</div>
          {row('Members',state.members.toLocaleString())}
          {row('Association',state.assocName)}
          {row('Branch',state.branchName)}
          {state.execName && row('Executive',state.execName)}
        </div>
        <div style={{background:'#2C2623',
          border:`1px solid ${isOut?'rgba(184,115,51,0.4)':state.pathway==='donor'?'rgba(74,222,128,0.3)':'rgba(53,94,141,0.3)'}`,
          borderRadius:12,padding:'16px 18px'}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'#6B7280',marginBottom:10}}>Pathway & Investment</div>
          {isOut && <>
            {row('Type','Branch Self-Pay (15% Off)',true,'#B87333')}
            {row('Year 1 Total',fmt(pricing.y1total),true)}
            {row('Month 1 (kickoff)',fmt(pricing.m1))}
            {row('Month 4 (balance)',fmt(pricing.m4))}
            {row('Year 2+ Renewal',`${fmt(pricing.renewal)}/yr (15% off)`)}
          </>}
          {state.pathway === 'donor' && <>
            {row('Type',`Bring Your Own Donor (${(pricing.disc*100).toFixed(0)}% off)`,true,'#4ade80')}
            {row('Years 1–3 Cost','$0 — your donor covers it',true,'#4ade80')}
            {row('Donor 3-yr Commitment',fmt(pricing.y1total+pricing.renewal*2))}
            {row('Year 4+ Renewal',`${fmt(pricing.renewal)}/yr`)}
            {state.assocBranches>1 && row('Assoc. Branches',state.assocBranches.toString())}
            {(state.networkBranches||0)>0 && row('Network Branches',state.networkBranches.toString())}
          </>}
          {state.pathway === 'waitlist' && <>
            {row('Type','Waitlist — PM Sources Donor',true,'#4A7BB0')}
            {row('Years 1–3 Cost','$0 — PM-sourced donor',true,'#4A7BB0')}
            {row('Year 4+ Renewal',`${fmt(RENEWAL)}/yr (standard rate)`)}
          </>}
        </div>
      </div>

      {/* Revenue assumptions */}
      <div style={{background:'#2C2623',border:'1px solid #3A3532',borderRadius:12,padding:'16px 18px',marginBottom:20}}>
        <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'#6B7280',marginBottom:10}}>Revenue Assumptions</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
          {[
            { label:'Group Classes', lines:[`${state.groupPct.toFixed(1)}% participation`,`$${state.groupPrice}/mo`,fmt(rev.revGroup)+'/yr'], color:'#4A7BB0' },
            { label:'Private Lessons', lines:[`${state.platformPct}% platform reach`,'10% commission (locked)',fmt(rev.revPrivate)+'/yr'], color:'#5eead4' },
            { label:'Membership Lift', lines:[state.memberLift>0?`$${state.memberLift.toFixed(2)}/member/mo`:'No lift applied','',fmt(rev.revMem)+'/yr'], color:'#B87333' },
          ].map(s => (
            <div key={s.label} style={{background:'#211E1C',borderRadius:10,padding:'12px'}}>
              <div style={{fontSize:11,fontWeight:700,color:s.color,marginBottom:6}}>{s.label}</div>
              {s.lines.filter(Boolean).map((l,i) => <div key={i} style={{fontSize:12,color:i===s.lines.length-1?'#fff':'#9aa3af',fontWeight:i===s.lines.length-1?700:400}}>{l}</div>)}
            </div>
          ))}
        </div>
        <div style={{marginTop:12,padding:'10px 12px',background:'#211E1C',borderRadius:8,display:'flex',justifyContent:'space-between',fontSize:13}}>
          <span style={{color:'#9aa3af'}}>Total Annual Revenue</span>
          <span style={{fontWeight:900,color:'#fff',fontSize:16}}>{fmt(rev.total)}</span>
        </div>
      </div>

      {/* Break-even */}
      <div style={{background:'#2C2623',border:'1px solid #3A3532',borderRadius:12,padding:'16px 18px',marginBottom:20}}>
        <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'#6B7280',marginBottom:10}}>Break-Even</div>
        {isOut ? (
          bem
            ? <div style={{fontSize:16,fontWeight:700}}>{bem<=12?`Month ${bem} — within Year 1`:`Month ${bem} (Year ${Math.ceil(bem/12)})`}</div>
            : <div style={{fontSize:16,fontWeight:700,color:'#f87171'}}>Revenue too low to break even at current assumptions</div>
        ) : (
          <div>
            <div style={{fontSize:16,fontWeight:700,color:state.pathway==='donor'?'#4ade80':'#4A7BB0',marginBottom:4}}>
              3-year head start · {fmt(rev.total*3)} accumulated before first renewal
            </div>
            <div style={{fontSize:13,color:'#9aa3af'}}>
              {rev.total>=costs[3]
                ? `Year 4 covered — ${fmt(rev.total-costs[3])} annual surplus after ${fmt(costs[3])} renewal`
                : `Need ${fmt(costs[3]-rev.total)} more in annual revenue to be self-sustaining by Year 4`}
            </div>
          </div>
        )}
      </div>

      {/* 5-year table */}
      <div style={{background:'#2C2623',border:'1px solid #3A3532',borderRadius:12,padding:'16px 18px',marginBottom:28}}>
        <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'#6B7280',marginBottom:12}}>5-Year Projection</div>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
          <thead>
            <tr>{['Year','Annual Revenue','Program Cost','Net','Cumulative Net','Notes'].map(h => (
              <th key={h} style={{textAlign:h==='Year'||h==='Notes'?'left':'right',padding:'4px 8px 10px',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'#6B7280',borderBottom:'1px solid #3A3532'}}>{h}</th>
            ))}</tr>
          </thead>
          <tbody>
            {years.map((y,i) => {
              const note = isCovered&&y.yr<=3
                ? (state.pathway==='donor'?'Your Donor':'PM-Sourced')
                : y.yr===1&&isOut ? `${Math.round(pricing.disc*100)}% off` : 'Renewal';
              const noteColor = isCovered&&y.yr<=3
                ? (state.pathway==='donor'?'#4ade80':'#4A7BB0') : '#6B7280';
              return (
                <tr key={y.yr} style={{borderBottom:'1px solid rgba(58,53,50,0.5)'}}>
                  <td style={{padding:'8px 8px',fontWeight:700}}>Year {y.yr}</td>
                  <td style={{padding:'8px 8px',textAlign:'right',fontVariantNumeric:'tabular-nums'}}>{fmt(rev.total)}</td>
                  <td style={{padding:'8px 8px',textAlign:'right',fontVariantNumeric:'tabular-nums',color:y.cost===0?'#4ade80':'inherit'}}>{y.cost===0?'$0':fmt(y.cost)}</td>
                  <td style={{padding:'8px 8px',textAlign:'right',fontWeight:700,fontVariantNumeric:'tabular-nums',color:y.net>=0?'#5eead4':'#f87171'}}>{fmtK(y.net)}</td>
                  <td style={{padding:'8px 8px',textAlign:'right',fontWeight:700,fontVariantNumeric:'tabular-nums',color:cumNets[i]>=0?'#5eead4':'#f87171'}}>{fmtK(cumNets[i])}</td>
                  <td style={{padding:'8px 8px',fontSize:11,color:noteColor}}>{note}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Footer */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:11,color:'#6B7280',borderTop:'1px solid #3A3532',paddingTop:14}}>
        <span>Practicing Musician · Social purpose corporation · 501(c)3 fiscal agent The Field</span>
        <span>practicingmusician.com</span>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   APP
══════════════════════════════════════════ */
const INIT = (() => {
  const p = new URLSearchParams(window.location.search);
  const branchName = p.get('branchName') || '';
  const fromNextSteps = !!branchName;
  return {
    step:            fromNextSteps ? 2 : 1,
    assocName:       p.get('assocName')  || '',
    branchName,
    execName:        p.get('execName')   || '',
    members:         parseInt(p.get('members'))        || 4230,
    pathway:         ['waitlist','donor','outright'].includes(p.get('pathway')) ? p.get('pathway') : null,
    assocBranches:   parseInt(p.get('assocBranches'))  || 1,
    networkBranches: parseInt(p.get('networkBranches'))|| 0,
    discountOverride: false, customDiscountPct: 21,
    groupPct:5, groupPrice:75, platformPct:10, memberLift:0,
  };
})();

function App() {
  const [state, setState] = useState(INIT);
  const set = k => v => setState(p => ({...p,[k]:v}));

  return (
    <>
      {/* Print summary — hidden in screen, shown when printing */}
      <div className="print-only">
        <PrintSummary state={state}/>
      </div>

      {/* Main UI */}
      <div className="no-print" style={{minHeight:'100vh',background:'var(--raisin)',padding:'32px 24px 80px'}}>
        <div style={{maxWidth:820,margin:'0 auto'}}>

          {/* Header */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:28}}>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:'var(--brass)',letterSpacing:'.09em',textTransform:'uppercase',marginBottom:3}}>Practicing Musician × YMCA</div>
              <div style={{fontSize:22,fontWeight:900,color:'var(--text)',letterSpacing:'-.01em'}}>Branch ROI Calculator</div>
            </div>
            {state.step > 1 && (
              <div style={{fontSize:12,color:'var(--text-dim)',textAlign:'right',lineHeight:1.6}}>
                <div style={{fontWeight:700,color:'var(--text)'}}>{state.branchName}</div>
                <div style={{color:state.pathway==='outright'?'var(--brass)':state.pathway==='donor'?'var(--green)':'var(--cerulean-light)',fontWeight:600}}>
                  {state.pathway==='outright'?'Branch Self-Pay':state.pathway==='donor'?'Bring Your Own Donor':'Waitlist · PM-Sourced'}
                </div>
              </div>
            )}
          </div>

          <div style={{marginBottom:28}}>
            <Progress step={state.step}/>
          </div>

          {/* Step card */}
          <div className="card" style={{padding:'32px 36px'}}>
            {state.step===1 && <Step1 state={state} setState={setState} onNext={()=>set('step')(2)}/>}
            {state.step===2 && <Step2 state={state} setState={setState} onNext={()=>set('step')(3)} onBack={()=>set('step')(1)}/>}
            {state.step===3 && <Step3 state={state} onBack={()=>set('step')(2)} onReset={()=>setState(INIT)}/>}
          </div>

        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
